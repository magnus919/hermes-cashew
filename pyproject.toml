[build-system]
requires = ["hatchling>=1.29"]
build-backend = "hatchling.build"

[project]
name = "hermes-cashew"
version = "0.10.2"
description = "Hermes Agent memory provider plugin backed by Cashew thought-graph memory."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Magnus Hedemark", email = "magnus919@pm.me" }]
dependencies = [
    "numpy",
    "sentence-transformers>=2.0",
    "scikit-learn",
    "PyYAML",
    "sqlite-vec",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10",
    "pytest-cov>=4.1,<8",
    "pytest-asyncio>=1.3",
    "pytest-mock>=3.15",
    "jsonschema>=4.18,<5",
    "PyYAML>=6.0",
    # Python 3.10 test compatibility for TOML contract assertions.
    "tomli>=2.0; python_version < '3.11'",
    "build>=1.0",
    "ruff>=0.4,<1",
    "mypy>=1.8,<3",
    "pre-commit>=3.6,<5",
    "vulture>=2.11,<3",
    "deptry>=0.12,<1",
    # Required by the locked diagnostics boundary regressions. Runtime remains opt-in.
    "opentelemetry-api>=1.20,<2",
    "sentry-sdk>=1.40,<3",
]

tracing = [
    "opentelemetry-api>=1.20,<2",
    "sentry-sdk>=1.40,<3",
]

[project.entry-points."hermes_agent.plugins"]
cashew = "plugins.memory.cashew"

[project.urls]
Homepage   = "https://github.com/magnus919/hermes-cashew"
Repository = "https://github.com/magnus919/hermes-cashew"
Issues     = "https://github.com/magnus919/hermes-cashew/issues"

[tool.hatch.metadata]
# Required for `pip install -e .` dev installs when the package itself is cloned from git.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# Intentional PEP 420 namespace package — do NOT add __init__.py at plugins/ or plugins/memory/.
# Doing so would shadow Hermes's bundled memory providers when both are on sys.path.
packages = ["plugins"]

[tool.hatch.build.targets.sdist]
# The upstream source fixture is immutable test evidence, not a release input.
exclude = ["/tests/fixtures/cashew-pr137"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--durations=10"
markers = [
    "real_embedding_child: exercise the isolated embedding worker with the offline child fixture",
]

[tool.ruff]
target-version = "py310"
# This file is a byte-identical upstream source fixture; formatting it changes
# the immutable provenance used by the subprocess compatibility proof.
exclude = ["tests/fixtures/cashew-pr137/core/integrity.py", "tests/fixtures/hermes-pm/plugin_declarations.py", "plugins/memory/cashew/_vendor/core", "plugins/memory/cashew/_vendor/scripts"]

[tool.ruff.lint]
select = ["E", "F", "N", "W", "I", "TD", "C90"]
ignore = ["E501", "N802", "N806"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N801", "N999", "C901"]
"__init__.py" = ["N999"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
files = ["plugins/memory/cashew"]
exclude = ["^__init__\\.py$", "plugins/memory/cashew/_vendor/core", "plugins/memory/cashew/_vendor/scripts"]

[[tool.mypy.overrides]]
module = "tests/*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "plugins.memory.cashew.verify"
ignore_errors = true

[[tool.mypy.overrides]]
module = "plugins.memory.cashew.sleep_cron_script"
ignore_errors = true

[[tool.mypy.overrides]]
module = "plugins.memory.cashew"
disable_error_code = ["type-arg", "index"]

[[tool.mypy.overrides]]
module = "plugins.memory.cashew.sleep_adapter"
disable_error_code = ["type-arg"]

[tool.deptry]
extend_exclude = ["tests", "__init__\\.py", "\\.venv"]
known_first_party = ["plugins"]
package_module_name_map = { "opentelemetry-api" = "opentelemetry" }

[tool.deptry.per_rule_ignores]
DEP001 = [ "sqlite-vec", "agent", "cron", "utils", "_hermes_cashew_impl", "opentelemetry-api", "sentry-sdk", "hermes_cli", "hermes_constants"]
DEP002 = ["pytest", "pytest-cov", "pytest-asyncio", "pytest-mock", "PyYAML", "tomli", "build", "ruff", "mypy", "pre-commit", "vulture", "deptry", "jsonschema", "opentelemetry-api", "sentry-sdk"]
DEP003 = ["httpx", "yaml"]

[[tool.mypy.overrides]]
module = ["plugins.memory.cashew._vendor.core.*", "plugins.memory.cashew._vendor.scripts.*"]
ignore_errors = true
follow_imports = "skip"

[tool.vulture]
exclude = ["plugins/memory/cashew/_vendor/core", "plugins/memory/cashew/_vendor/scripts"]
