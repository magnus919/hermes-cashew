# Schema verified from NousResearch/hermes-agent/plugins/memory/{honcho,hindsight}/plugin.yaml@main
# Hooks list is minimal for Phase 1 — add on_turn_start / on_memory_write / on_delegation in later phases
# as their methods are implemented. Declaring a hook here whose method doesn't yet exist may trip loader probes.
manifest_version: 1
name: cashew
version: 0.10.2
description: "Cashew — persistent thought-graph memory with local embeddings, organic decay, and autonomous think cycles."
pip_dependencies:
  - "cashew-brain @ https://github.com/rajkripal/cashew/archive/ac090ce75ffd2e97dac257cee9430628c68aa241.tar.gz#sha256=0777dcb89bde8e0d6103786358c93c0ad3fd4ffb7f8a210194c37b211ae4c28b"
  - "numpy"
  - "sentence-transformers"
  - "sqlite-vec"
requires_env: []
hooks:
  - on_session_end
  - on_pre_compress
