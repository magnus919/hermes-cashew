name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      github.actor == github.repository_owner && (
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode')
      )
    environment: opencode
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Verify trusted pull request
        id: trust
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_URL: ${{ github.event.issue.pull_request.url || github.event.pull_request.url }}
          PULL_REQUEST_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [[ -z "${PULL_REQUEST_URL}" ]]; then
            echo "allowed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          head_repository="$(gh api "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}" --jq '.head.repo.full_name')"
          if [[ "${head_repository}" != "${REPOSITORY}" ]]; then
            echo "allowed=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Skipping OpenCode for a fork-backed pull request."
            exit 0
          fi

          echo "allowed=true" >> "${GITHUB_OUTPUT}"

      - name: Checkout repository
        if: steps.trust.outputs.allowed == 'true'
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run opencode
        if: steps.trust.outputs.allowed == 'true'
        # anomalyco/opencode v1.18.29
        uses: anomalyco/opencode/github@02a167e048d3bd7299225068d79e4fce5c830d67
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          model: openrouter/moonshotai/kimi-k2.6
