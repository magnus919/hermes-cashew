# DO NOT RENAME THIS FILE. Phase 5's release.yml and PyPI trusted-publisher config lock in workflow
# filenames. Renaming tests.yml -> ci.yml will break trusted publishing when release.yml is added
# (see 01-RESEARCH.md Pitfall 6).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python:
    name: Test (Python ${{ matrix.python }})
    # Use self-hosted runner for same-repo PRs and pushes; GitHub-hosted for fork PRs
    # (fork PRs on self-hosted runners are a security risk — arbitrary code execution)
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || '["self-hosted","linux","x64","hermes-cashew","docker"]') }}
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml declares Python 3.10 as the floor. Exercise that floor
        # and the current locked CI runtime; intermediate minors are covered by
        # normal dependency resolution but are not a release support promise.
        include:
          # setup-python bootstraps a compatible minor on Ubuntu 20.04; uv then
          # installs the exact locked patch release used for tests.
          - setup: "3.10"
            python: "3.10.19"
          - setup: "3.12"
            python: "3.12.11"
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.setup }}

      - name: Install
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/uv-python
          UV_PYTHON_BIN_DIR: ${{ runner.temp }}/uv-python-bin
        run: |
          python -m pip install "uv==0.11.18"
          uv python install --managed-python "${{ matrix.python }}"
          uv sync --frozen --extra dev --managed-python --python "${{ matrix.python }}"
        timeout-minutes: 5

      - name: Verify Cashew source and SQLite migration capability
        run: .venv/bin/python scripts/verify-cashew-baseline.py

      - name: AGENTS.md validation — verify install and test commands work
        run: |
          echo "::group::Validating AGENTS.md commands"
          # Verify the frozen dev environment works (just synced above).
          .venv/bin/python -c "import plugins.memory.cashew; print('import OK')"
          # Verify 'pytest' collect works
          .venv/bin/pytest --collect-only -q
          echo "::endgroup::"

      - name: Lint with ruff
        if: matrix.python == '3.12.11'
        run: .venv/bin/ruff check plugins/memory/cashew/ tests/ --output-format=github

      - name: Type check with mypy
        if: matrix.python == '3.12.11'
        run: |
          .venv/bin/python scripts/check-recursive-symlinks.py plugins/memory/cashew/
          .venv/bin/mypy --explicit-package-bases plugins/memory/cashew/

      - name: Dead code detection with vulture
        if: matrix.python == '3.12.11'
        run: .venv/bin/vulture plugins/memory/cashew/ --min-confidence 80

      - name: Duplicate code detection
        if: matrix.python == '3.12.11'
        run: .venv/bin/python scripts/check-duplicates.py

      - name: Dead feature flag detection
        if: matrix.python == '3.12.11'
        run: .venv/bin/python scripts/check-dead-flags.py

      - name: Unused dependency detection with deptry
        if: matrix.python == '3.12.11'
        run: .venv/bin/deptry .

      - name: Run tests with coverage (capture log for offline-download scan)
        run: |
          set -o pipefail
          .venv/bin/pytest -vs --cov=plugins/memory/cashew --cov-report=term --cov-report=xml --cov-fail-under=75 2>&1 | tee pytest.log

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python }}
          path: coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: CI-03 — fail if embedding model was downloaded
        run: |
          if grep -E 'Downloading.*MiniLM' pytest.log; then
            echo "::error::Embedding model download detected — offline fixture bypassed"
            exit 1
          fi

      - name: Build performance summary
        run: |
          START=$(date -d "${{ github.run_started_at }}" +%s 2>/dev/null || date -jf "%Y-%m-%dT%H:%M:%S" "${{ github.run_started_at }}" +%s)
          NOW=$(date +%s)
          ELAPSED=$((NOW - START))
          echo "Workflow run started at: ${{ github.run_started_at }}"
          echo "Total elapsed time: ${ELAPSED}s (test job only)"
          echo "Install: uv sync --frozen --extra dev"
          echo "Optimizations: locked uv environment, complete pytest failure report"

  # Keep the historical required-check context stable while the actual test
  # workers fan out by Python version. `if: always()` converts any cancelled,
  # skipped, or failed matrix result into a visible failure for branch policy.
  test:
    name: test
    needs: test-python
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all supported Python workers to pass
        env:
          MATRIX_RESULT: ${{ needs['test-python'].result }}
        run: |
          test "$MATRIX_RESULT" = "success" || {
            echo "::error::supported Python matrix result: $MATRIX_RESULT"
            exit 1
          }

  wheel-smoke:
    # Same fork-conditional as test job above
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || '["self-hosted","linux","x64","hermes-cashew","docker"]') }}
    needs: test
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build wheel
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/uv-python
          UV_PYTHON_BIN_DIR: ${{ runner.temp }}/uv-python-bin
        run: |
          python -m pip install "uv==0.11.18"
          uv python install --managed-python "3.12.11"
          uv sync --frozen --extra dev --managed-python --python "3.12.11"
          .venv/bin/python -m build
          .venv/bin/python scripts/verify-distributions.py dist/*

      - name: CI-02 — install wheel into clean venv and verify discovery
        run: |
          set -o pipefail
          WHEEL_SMOKE_VENV="$RUNNER_TEMP/hermes-cashew-wheel-smoke"
          .venv/bin/python -m venv --clear "$WHEEL_SMOKE_VENV"
          {
            "$WHEEL_SMOKE_VENV/bin/pip" install dist/*.whl
            (
              cd "$RUNNER_TEMP"
              "$WHEEL_SMOKE_VENV/bin/python" -c "
          from pathlib import Path
          import plugins.memory.cashew
          loaded = Path(plugins.memory.cashew.__file__).resolve()
          assert '$GITHUB_WORKSPACE' not in str(loaded), loaded
          print(f'wheel import: {loaded}')
          "
              "$WHEEL_SMOKE_VENV/bin/python" "$GITHUB_WORKSPACE/scripts/verify-cashew-baseline.py"
            )
            "$WHEEL_SMOKE_VENV/bin/python" -c "
          import importlib.metadata as im
          eps = list(im.entry_points(group='hermes_agent.plugins'))
          names = {ep.name for ep in eps}
          assert 'cashew' in names, f'missing cashew entry point; got {names}'
          print('OK — entry point discoverable')
          "
          } 2>&1 | tee wheel-smoke.log

      - name: CI-02 — install sdist and exercise flat cron registration outside checkout
        run: |
          set -o pipefail
          SDIST_SMOKE_VENV="$RUNNER_TEMP/hermes-cashew-sdist-smoke"
          FLAT_SMOKE_HOME="$RUNNER_TEMP/hermes-cashew-flat-profile"
          FLAT_UNPACKED="$RUNNER_TEMP/hermes-cashew-flat-source"
          .venv/bin/python -m venv --clear "$SDIST_SMOKE_VENV"
          {
            "$SDIST_SMOKE_VENV/bin/pip" install dist/*.tar.gz
            (
              cd "$RUNNER_TEMP"
              "$SDIST_SMOKE_VENV/bin/python" -c "
          from pathlib import Path
          import plugins.memory.cashew
          loaded = Path(plugins.memory.cashew.__file__).resolve()
          assert '$GITHUB_WORKSPACE' not in str(loaded), loaded
          print(f'sdist import: {loaded}')
          "
              "$SDIST_SMOKE_VENV/bin/python" "$GITHUB_WORKSPACE/scripts/verify-cashew-baseline.py"
            )
            mkdir -p "$FLAT_UNPACKED" "$FLAT_SMOKE_HOME/plugins"
            tar -xzf dist/*.tar.gz -C "$FLAT_UNPACKED" --strip-components=1
            mv "$FLAT_UNPACKED" "$FLAT_SMOKE_HOME/plugins/cashew"
            (
              cd "$RUNNER_TEMP"
              "$SDIST_SMOKE_VENV/bin/python" "$GITHUB_WORKSPACE/scripts/smoke-flat-install.py" \
                "$FLAT_SMOKE_HOME/plugins/cashew" "$FLAT_SMOKE_HOME"
            )
          } 2>&1 | tee sdist-smoke.log

      - name: Install flat-manifest dependency and verify update and rollback
        run: |
          set -o pipefail
          FLAT_SMOKE_VENV="$RUNNER_TEMP/hermes-cashew-flat-smoke"
          FLAT_DEP="$(.venv/bin/python -c "import yaml; print(next(d for d in yaml.safe_load(open('plugin.yaml'))['pip_dependencies'] if d.startswith('cashew-brain ')))")"
          .venv/bin/python -m venv --clear "$FLAT_SMOKE_VENV"
          {
            # Model an existing user on the public 1.2.1 wheel, then apply the
            # manifest source without relying on a higher version number.
            "$FLAT_SMOKE_VENV/bin/pip" install --no-deps "cashew-brain==1.2.1"
            "$FLAT_SMOKE_VENV/bin/pip" install --force-reinstall --no-deps "$FLAT_DEP"
            "$FLAT_SMOKE_VENV/bin/python" scripts/verify-cashew-baseline.py

            # Roll back to the released artifact, whose identical 1.2.1 version
            # makes source provenance more reliable than version checks.
            "$FLAT_SMOKE_VENV/bin/pip" install --force-reinstall --no-deps "cashew-brain==1.2.1"
            "$FLAT_SMOKE_VENV/bin/python" -c "
          import hashlib
          import importlib.metadata as metadata
          from pathlib import Path

          distribution = metadata.distribution('cashew-brain')
          assert distribution.read_text('direct_url.json') is None
          session_hash = hashlib.sha256(
              Path(distribution.locate_file('core/session.py')).read_bytes()
          ).hexdigest()
          assert session_hash != '0ce60cc63adf4fb7136581aee722bb10e9a344e556b6fb98f4d46855d53c36cd'
          print(f'cashew-brain rollback verified: {session_hash}')
          "

            # Reapply the manifest requirement exactly as existing users must
            # after a Hermes update or venv rebuild.
            "$FLAT_SMOKE_VENV/bin/pip" install --force-reinstall --no-deps "$FLAT_DEP"
            "$FLAT_SMOKE_VENV/bin/python" scripts/verify-cashew-baseline.py
          } 2>&1 | tee flat-smoke.log

      - name: CI-03 (wheel-smoke) — fail if embedding model was downloaded during wheel install/import
        run: |
          if grep -E 'Downloading.*MiniLM' wheel-smoke.log flat-smoke.log sdist-smoke.log; then
            echo "::error::Embedding model download detected during wheel smoke — offline env bypassed"
            exit 1
          fi
