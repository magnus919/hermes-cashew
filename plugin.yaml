# Root-level Hermes plugin manifest.
#
# Why two plugin.yaml files? Per the Phase 1 install-path spike (same as bundled manifest in plugins/memory/cashew/).
manifest_version: 1
name: cashew
version: 0.10.2
description: "Cashew — persistent thought-graph memory with local embeddings, organic decay, and autonomous think cycles."
pip_dependencies:
  - "cashew-brain @ https://github.com/rajkripal/cashew/archive/dd57ef029cf9a6dce0b8145d335a55202dd1bac4.tar.gz#sha256=38d2cb085fc8970a285991fca5df6b44309324b80947bb816f738a9acaaf72ab"
  - "numpy"
  - "scikit-learn"
  - "sentence-transformers"
  - "sqlite-vec"
requires_env: []
hooks:
  - on_session_end
  - on_pre_compress
