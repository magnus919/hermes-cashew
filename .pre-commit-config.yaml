repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^(tests/fixtures/(cashew-pr137/core/integrity\.py$|hermes-pm/)|plugins/memory/cashew/_vendor/(core/|scripts/))
      - id: ruff-format
        exclude: ^(tests/fixtures/(cashew-pr137/core/integrity\.py$|hermes-pm/)|plugins/memory/cashew/_vendor/(core/|scripts/))

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(plugins/memory/cashew/_vendor/(core/|scripts/|LICENSE$)|tests/fixtures/hermes-pm/)
      - id: end-of-file-fixer
        exclude: ^(plugins/memory/cashew/_vendor/(core/|scripts/|LICENSE$)|tests/fixtures/hermes-pm/)
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key
